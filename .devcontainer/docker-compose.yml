services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ..:/var/www/html:cached
      - product_uploads:/var/www/html/uploads/products
    environment:
      DB_HOST: db
      DB_NAME: oportuniza_bie
      DB_USER: oportuniza_dev
      DB_PASS: dev_only_oportuniza_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: oportuniza_bie
      MYSQL_USER: oportuniza_dev
      MYSQL_PASSWORD: dev_only_oportuniza_password
      MYSQL_ROOT_PASSWORD: dev_only_root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdev_only_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  product_uploads:
